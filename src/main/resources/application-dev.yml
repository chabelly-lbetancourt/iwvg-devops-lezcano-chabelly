server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devops_db
    username: ${SPRING_DATASOURCE_USERNAME:devops_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
