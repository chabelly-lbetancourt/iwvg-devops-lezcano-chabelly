name: CD PRO
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on AWS Lightsail
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Extract registry, repository (lowercase) & version from pom
        run: |
          echo "GHCR_URL=ghcr.io" >> $GITHUB_ENV
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}

      - name: 🚀 Deploy on AWS Lightsail
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          REMOTE_USER: ${{ secrets.LIGHTSAIL_USER }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          GH_USER: ${{ github.actor }}
          IMAGE: ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"

          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/app"
          scp $SSH_OPTS docker-compose.prod.yml init.sql "$REMOTE_USER@$HOST:~/app/"
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$REMOTE_USER@$HOST" \
            "docker login ghcr.io -u '$GH_USER' --password-stdin"
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" \
            "cd ~/app && IMAGE='$IMAGE' docker compose -f docker-compose.prod.yml pull \
             && IMAGE='$IMAGE' docker compose -f docker-compose.prod.yml up -d --remove-orphans \
             && docker image prune -f"

      - name: ✅ Health check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "http://${{ secrets.LIGHTSAIL_HOST }}/actuator/health"